# Настройки путей
paths:
  raw_db: "data/raw/cars.db"
  cleaned_csv: "data/cleaned/cars_ready.csv"
  model_dir: "models"
  model_name: "catboost_car_model_v2.cbm"
  train_log_dir: "reports/catboost_info"

# Настройки предобработки
preprocessing:
  current_year: 2026
  n_clusters: 5
  random_state: 42
  price_min: 30000
  price_max: 5000000

# Настройки обучения CatBoost
model:
  iterations: 1000
  learning_rate: 0.1
  depth: 6
  eval_metric: "RMSE"
  random_seed: 42
  verbose: 100
  early_stopping_rounds: 50

# Здесь мы оставляем структуру, но скрываем пароль
database:
  url: "postgresql://YOUR_LOGIN:YOUR_PASSWORD@localhost:5433/car_price_advisor"